spring:
  application:
    name: tavoo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tavoodb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  error:
    include-message: never

tavoo:
  business-zone: ${TAVOO_BUSINESS_ZONE:Europe/Rome}
  bootstrap-admin:
    username: ${TAVOO_ADMIN_USERNAME:tavooadmin}
    password: ${TAVOO_ADMIN_PASSWORD:Tavoo2026+}
  security:
    jwt:
      secret: ${TAVOO_JWT_SECRET:5RcctwKcrZ4VdBJZSNmOGwrjG2LVO9MZrVYCEIJMipm}
      access-token-ttl: ${TAVOO_JWT_TTL:PT15M}
      remember-me-token-ttl: ${TAVOO_JWT_REMEMBER_ME_TTL:P30D}
